name: Changelog watch (hourly)

# 한 시간마다 패치노트를 본다. 새 버전이 없으면 스크립트가 바로 빠져나가 커밋도 토큰도 0이라,
# 자주 봐도 드는 건 러너 1분뿐이다(공개 저장소라 무료). 새 버전이 있는 시각에만
# 큐레이션이 돌아, 값은 하루 한 번 돌 때와 같고 화면만 한 시간 안에 따라붙는다.
# (2026-08-13 까지는 하루 한 번 20:20 UTC = 05:20 KST 였다.)
on:
  schedule:
    - cron: "5 * * * *"     # 매시 5분 — GitHub cron 은 정시에 몰려 밀리므로 5분 비켜 놓는다
  workflow_dispatch:          # 수동 실행 버튼

permissions:
  contents: write
  id-token: write   # claude-code-action OIDC 토큰용

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── 1단계(a): Claude Code 버전 목록 (토큰 0, 순수 스크립트) ──
      - name: Update Claude Code version list
        id: update
        run: python scripts/update_changelog.py

      - name: Commit CC version list
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "ai-pick-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: ${{ steps.update.outputs.added_versions }} 자동 추가"
          git push

      # ── 1단계(b): Codex 버전 목록 (토큰 0, openai/codex GitHub releases) ──
      - name: Update Codex version list
        id: codex
        run: python scripts/update_codex.py

      - name: Commit Codex version list
        if: steps.codex.outputs.cx_changed == 'true'
        run: |
          git config user.name "ai-pick-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore(codex): ${{ steps.codex.outputs.cx_added_versions }} 자동 추가"
          git push

      # ── 1단계(c): Antigravity CLI 버전 목록 (토큰 0, google-antigravity/antigravity-cli GitHub releases) ──
      - name: Update Antigravity version list
        id: agy
        run: python scripts/update_agy.py

      - name: Commit Antigravity version list
        if: steps.agy.outputs.ag_changed == 'true'
        run: |
          git config user.name "ai-pick-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore(agy): ${{ steps.agy.outputs.ag_added_versions }} 자동 추가"
          git push

      # ── blog/news 수집 — 화면엔 안 올리고 철회·중단 감지에만 쓴다 ──
      - name: Detect new blog/news posts
        id: blog
        run: python scripts/collect_blog.py || echo '[]' > new_blog.json

      # ── 큐레이션 실행 조건: CC·Codex·Antigravity 중 하나라도 새 feature ──
      # 새 feature 가 있을 때만 큐레이션한다.
      # 블로그는 화면에 안 올리므로 게이트에서 뺐다 — 블로그 화면을 없앤 뒤로
      # index.html 에 아는 주소가 없어 매일 "새 글 12개" 가 잡히고, 그대로 두면
      # 할 일이 없는 날에도 큐레이션이 매일 돌아 구독 사용량만 먹는다.
      # 철회·중단 감지는 feature 가 있는 날 new_blog.json 을 같이 읽어 처리한다.
      - name: Decide curation
        id: gate
        run: echo "go=${{ steps.update.outputs.has_features == 'true' || steps.codex.outputs.cx_has_features == 'true' || steps.agy.outputs.ag_has_features == 'true' }}" >> "$GITHUB_OUTPUT"

      # ── stage-2: 헤드리스 claude -p 가 워킹트리 index.html을 직접 Edit (새로 나온 것·용도별) ──
      # (구 claude-code-action@v1 은 PR/브랜치 모드라 워킹트리를 안 고쳐 매번 noop → 헤드리스로 교체)
      - name: Install Claude Code CLI
        if: steps.gate.outputs.go == 'true'
        run: npm install -g @anthropic-ai/claude-code

      # ── 패치노트 기능(feature) 한국어화 — 전용 스텝(번들 curate가 버전 번역을 자주 누락해 분리) ──
      - name: Translate feature notes (headless)
        if: steps.gate.outputs.go == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "$(cat scripts/translate_features.md)" \
            --model claude-sonnet-4-6 \
            --max-turns 60 \
            --permission-mode acceptEdits \
            --allowedTools "Read,Edit,Glob,Grep" \
            --output-format json \
          || echo "::warning::feature translation step returned non-zero"

      - name: Curate (headless claude -p)
        if: steps.gate.outputs.go == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "$(cat scripts/curate_prompt.md)" \
            --model claude-sonnet-4-6 \
            --max-turns 80 \
            --permission-mode acceptEdits \
            --allowedTools "Read,Edit,Glob,Grep" \
            --output-format json \
          || echo "::warning::curation step returned non-zero — JS verify/commit steps will gate the result"

      - name: Verify JS integrity (revert if broken)
        if: steps.gate.outputs.go == 'true'
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('index.html','utf8');const i=s.lastIndexOf('<script>'),j=s.lastIndexOf('</script>');fs.writeFileSync('/tmp/c.js',s.slice(i+8,j))"
          if ! node --check /tmp/c.js; then echo '::error::JS broken by curation — reverting index.html'; git checkout index.html; fi

      # ── 링크 점검 (경고만) — 이 사이트는 값의 대부분이 링크다 ──
      - name: Check links
        if: steps.gate.outputs.go == 'true'
        run: python3 scripts/check_links.py || echo "::warning::링크 점검에 걸린 게 있다 — 화면은 그대로 나가지만 확인할 것"

      - name: Commit curation changes
        if: steps.gate.outputs.go == 'true'
        run: |
          git config user.name "ai-pick-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet index.html; then
            git add index.html
            git commit -m "chore: 큐레이션 갱신 — 새로 나온 것·용도별 (Claude)"
            git push
          else
            echo "큐레이션 변경 없음"
          fi
